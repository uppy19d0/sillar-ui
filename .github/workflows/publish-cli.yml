name: Publish Sillar CLI

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Use the temporary token for a verified first release
        type: boolean
        default: false
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

concurrency:
  group: npm-publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run check
      - name: Test package artifact guard
        run: node --test scripts/check-package-contents.test.mjs
      - name: Verify published package contents
        run: node scripts/check-package-contents.mjs packages/cli
      - name: Verify release tag matches CLI package version
        run: node scripts/verify-cli-release.mjs "${GITHUB_REF_NAME}"
      - name: Publish CLI with trusted provenance
        run: npm publish ./packages/cli --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
