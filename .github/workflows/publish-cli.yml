name: Publish Sillar CLI

on:
  workflow_dispatch:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an OIDC-capable npm client
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm audit signatures
      - run: npm run check
      - name: Verify release tag matches CLI package version
        run: node scripts/verify-cli-release.mjs "${GITHUB_REF_NAME}"
      - name: Publish CLI with trusted provenance
        run: npm publish ./packages/cli --access public
